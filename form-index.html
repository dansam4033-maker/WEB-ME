<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>form</title>
</head>
<style>
    *{
        margin: 0px;
        padding: 5px;
    }

    body{
        display: flex;
        justify-content: center;
        align-items: center;
        background-color: rgb(248, 248, 247);
        padding: 20px;
    }

    form{
        display: flex;
        flex-direction: column;
        background: rgba(225, 222, 222, 0.311);
        box-shadow: 0px 2px 1px 1px;
        border-radius: 12px;
        padding: 30px;
        width: 100%;
        min-width: 300px;
    }

    label{
        font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
        display: block;
        ;
    }
    input{
        border: solid 1px grey;
        border-radius: 10px;
        /*box-shadow: 1px 2px 1px 1px;*/
    }

    input:focus, select:cous{
        border-color: red;
        
    }
    .radio{
        box-shadow: none;
    }
    button{
        background-color: red;
        border-radius: 10px;
        color: white;
        border: 0px;
        font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
        font-size: 20px;
        padding: 12px;
        cursor: pointer;
    }

    button:hover{
        background: brown;
    }

    select{
        border-radius: 5px;
        width: 6rem;
        cursor: pointer;
    }

    /* .option:hover{
            color: red;
    } */
</style>
<body>
    <div class="form house">
        <h2>Fill the form</h2>
        <form action="#" method="post">
            <label for="name"> Full Name</label>
            <input type="text" placeholder="Enter your full name">

            <label for="email"> Email address</label>
            <input type="email" placeholder="Enter your email">

            <label for="Phone"> Phone</label>
            <input type="tel" placeholder="Enter your phone">

            <label for="address"> Address</label>
            <input type="text" placeholder="Address">

            <label for="Password"> Password</label>
            <input type="password" placeholder="Enter password">

            <label for="">Gender</label>
            <div class="gender">
                <label>
                    Male  <input type="radio" value="Male">
                </label>

                <label>
                    Female  <input type="radio" *value="Female">
                </label>
            </div>
            <div>
                <label for="">State of origin</label>
                <select >
                    <option value="">Taraba</option>
                    <option value="">Gombe</option>
                    <option value="">Bauchi</option>
                    <option value="">Kaduna</option>
                    <option value="">Katsina</option>
                    <option value="">Yobe</option>
                    <option value="">Zamfara</option>
                    <option value="">Sokoto</option>
                </select>
            </div>
            <button>Submit</button>
            <!-- <div>
                <textarea name="" col="5" rows="10"  id=""></textarea>
            </div> -->
        </form>
    </div>
    <!--FREESTOCK PHOTOS FOR GETTING PHOTOS-->
</body>
</html>
