<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>doughdream</title>
</head>
<style>
*{
    margin: 5px;
    padding: 0px;
}

body{
    background-image: url(45.jfif);
    background-repeat: no-repeat;
    background-size: cover;
    background-position: center;
}

nav{
    display: flex;
    margin: 7px;
    padding: 5px;
    /* justify-content: space-around; */
    justify-content: space-between;
    position: fixed;;
    top: 0%;
    right: 0%;
    left: 0%;
    background-color: rgba(128, 128, 128, 0.395);

}

.left{
    margin: 0px;
    font-family:fantasy;
    color: gold;
    font-size: 32px;
}

.right{
    /* margin: 10px; */
    font-family: Arial, Helvetica, sans-serif;
    font-size: 16px;
    margin-left: 45%;
}

a{
    text-decoration: none;
    text-align: center;
    color: white;
}

.search{
    margin-left: 0px;
    font-size: 20px;
    margin-left: 40px;
    color: white;
}


.sales{
    margin-left: 30px;
    color: white;
}

.login{
    border-radius: 20px;
    border: solid 2px white;
    background-color: transparent;
    padding: 10px;
    width: 100px;
    color: white;
    font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
    margin-left: 4rem;
}

.frame{
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    margin: 20%;
}

h1{
    font-family: cursive;
    font-size: 50px;
    font-weight: bold;
    color: rgb(192, 250, 3);
    text-align: left;
}

h4{
    font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
    font-size: 25px;
    text-align: left;
    color: rgb(175, 155, 2);
}

.order{
    color: black;
    border: solid 1px grey;
    background-color: white;
    border-radius: 10px;
    padding: 15px;
    width: 100px;
    font-family: Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif;
}

a:hover{
    background-color: rgb(58, 32, 3);
}

.order:hover{
    background: red;
    color: white;
}
</style>
<body>
    <nav>
        <div class="left">Doughdream</div>
        <div class="right">
            <a href="#">Home</a>
            <a href="#">About us</a>
            <a href="#">Menu</a>
            <a href="#">Contact</a>
        </div>
        <div class="search">🔍</div>
        <div class="sales">🛒</div>
        <button class="login">Login</button>
    </nav>

    <div class="frame">
        <h1>DELICIOUS PARTY DISHES <br> for everyone!</h1>
        <h4>"Baked with love and joy, <br>Made to share with everyone</h4>
    <button class="order">Order now</button>    
    </div>
    
</body>
</html>
